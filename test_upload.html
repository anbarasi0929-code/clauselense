
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ClauseLens Backend Test</title>
</head>
<body>
    <h1>ClauseLens Contract Upload Test</h1>

    <form id="uploadForm">
        <input type="file" id="file" accept=".pdf,.docx" required>
        <button type="submit">Analyze Contract</button>
    </form>

    <h2>Result</h2>
    <pre id="result">Choose a PDF or DOCX file.</pre>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const file = document.getElementById("file").files[0];
            const result = document.getElementById("result");
            const formData = new FormData();

            formData.append("file", file);
            result.textContent = "Analyzing document...";

            try {
                const response = await fetch("http://127.0.0.1:5000/api/analyze", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = "Could not connect to the backend.";
            }
        });
    </script>
</body>
</html>
